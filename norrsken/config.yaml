name: Norrsken IPTV
version: "1.12.0"
slug: norrsken
description: Egen IPTV-app med streamingkänsla för Philips-tv:n. Tv-appen finns på http://192.168.85.51:8787/ och inställningarna på http://192.168.85.51:8787/setup
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
hassio_api: true
host_network: true
ingress: true
ingress_port: 8787
panel_icon: mdi:television-play
panel_title: Norrsken
# read-only: the key for the provider's account lives in Home Assistant's secrets.yaml
map:
  - homeassistant_config:ro
  # network disks mounted in Home Assistant (Settings → System → Storage → Add network storage) show up here
  - media:rw
  - share:rw
options:
  setup_pin: ""
  storage_dir: ""
schema:
  setup_pin: str?
  storage_dir: str?
